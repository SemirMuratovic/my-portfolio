<section>

      <a href="#"><img src="./assets/images/logo-dark.png" alt="" /></a>

    <div class="legal">
      <p>© Semir Muratovic 2025</p>
      <a class="impressum" href="imprint">{{ "footer.imprint" | translate }}</a>

          alt=""
